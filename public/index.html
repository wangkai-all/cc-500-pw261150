<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平台佣金结算分析</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">¥</span>
    <div>
      <h1>平台佣金结算分析</h1>
      <p class="subtitle">订单拆分 · 优惠分摊 · 退款补贴 · 跨期结算 · 费率版本 · 差异批次 · 争议审批</p>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="dashboard" class="active">总览</button>
    <button data-tab="batches">结算批次</button>
    <button data-tab="lines">结算明细</button>
    <button data-tab="diffs">差异批次</button>
    <button data-tab="disputes">争议</button>
    <button data-tab="rates">费率版本</button>
    <button data-tab="trace">订单追溯</button>
  </nav>
</header>

<main id="main">
  <section id="tab-dashboard" class="tab-panel active">
    <div class="stat-row" id="statRow"></div>
    <div class="card">
      <h2>各批次佣金 / 商家应付</h2>
      <div id="batchChart" class="chart-wrap"></div>
    </div>
  </section>

  <section id="tab-batches" class="tab-panel">
    <div class="card">
      <div class="card-head">
        <h2>结算批次</h2>
        <form id="runForm" class="inline-form">
          <input type="month" id="runPeriod" required>
          <select id="runRate"></select>
          <button type="submit" class="btn primary">运行结算</button>
        </form>
      </div>
      <div class="table-wrap"><table id="batchTable"></table></div>
      <p class="hint">重复运行同周期同费率版本的结算是幂等的（重放安全），不会生成重复数据。</p>
    </div>
  </section>

  <section id="tab-lines" class="tab-panel">
    <div class="card">
      <div class="card-head">
        <h2>结算明细</h2>
        <select id="linesBatchSelect"></select>
      </div>
      <div id="linesMeta"></div>
      <div class="table-wrap"><table id="linesTable"></table></div>
    </div>
  </section>

  <section id="tab-diffs" class="tab-panel">
    <div class="card">
      <h2>差异批次（费率修订）</h2>
      <div class="table-wrap"><table id="diffTable"></table></div>
    </div>
  </section>

  <section id="tab-disputes" class="tab-panel">
    <div class="card">
      <h2>争议管理</h2>
      <div class="table-wrap"><table id="disputeTable"></table></div>
    </div>
  </section>

  <section id="tab-rates" class="tab-panel">
    <div class="card">
      <div class="card-head">
        <h2>费率版本</h2>
        <form id="rateForm" class="inline-form">
          <input type="text" id="rateName" placeholder="版本名称" required>
          <input type="number" id="rateBps" placeholder="费率基点 (1000=10%)" min="0" max="10000" required>
          <input type="month" id="rateFrom" required>
          <button type="submit" class="btn primary">新建版本</button>
        </form>
      </div>
      <div class="table-wrap"><table id="rateTable"></table></div>
    </div>
    <div class="card">
      <h2>发起费率修订（生成差异批次）</h2>
      <form id="reviseForm" class="inline-form">
        <label>结算周期 <input type="month" id="revisePeriod" required></label>
        <label>新费率版本 <select id="reviseRate"></select></label>
        <button type="submit" class="btn warn">修订并生成差异批次</button>
      </form>
      <p class="hint">修订不会改动已结算的历史批次，而是生成一个差异批次（佣金差额），独立走审批与付款；同一原批次对同一新版本只生成一次。</p>
    </div>
  </section>

  <section id="tab-trace" class="tab-panel">
    <div class="card">
      <div class="card-head">
        <h2>订单追溯</h2>
        <select id="traceOrderSelect"></select>
      </div>
      <div id="traceView"></div>
    </div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalDesc"></p>
    <textarea id="modalInput" rows="3" placeholder="填写说明…"></textarea>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">取消</button>
      <button class="btn primary" id="modalOk">确定</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
